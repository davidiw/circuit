server {
  listen 80;
  server_name circuit.davidwolinsky.com;

  location ^~ /.well-known/acme-challenge/ {
    alias /var/lib/letsencrypt/.well-known/acme-challenge/;
    default_type "text/plain";
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name circuit.davidwolinsky.com;

  ssl_certificate     /etc/letsencrypt/live/circuit.davidwolinsky.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/circuit.davidwolinsky.com/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  # The app authenticates (signed session cookie); no auth_basic here.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;

  client_max_body_size 1m;

  location / {
    proxy_pass http://127.0.0.1:8797;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }
}
